# at 8daf7f09; these rows' lines are at 8daf7f09. For rp-give-back, a purpose, verified means its approvals.jsonl
# quotes are exact and the mechanism rows it rests on hold. The ids are new: `rp-purpose` is cited in MESSAGING.md's
# 7 Nov blocks for other words, and an id that reads "no paid order, no cashback" reads both ways.
