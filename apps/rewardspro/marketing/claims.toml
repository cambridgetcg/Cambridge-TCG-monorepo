  "app/lib/record-order.server.ts:225-238: the only credit payout is created here, for a recorded order's cashback entry",
  "app/lib/refunds.server.ts:247-253: the only other payout.create, a refund's debit",
  "app/lib/record-order.server.ts:92 and 61: an order with no customer is not recorded; an imported order earns nothing (reason import)",
  "recordOrder's three callers: app/routes/webhooks.orders.paid.tsx:55 (orders/paid, shopify.app.toml:25-27); app/lib/payout-check.server.ts:536, the hourly sweep, whose list (app/shopify/order-source.server.ts:755) holds only paid, partly refunded or refunded orders; app/lib/import.server.ts:41, the past-orders import",
  "app/lib/payouts.server.ts:139-152 and 529-543: adjustment entries create no payout; :240-241: the one credit call to Shopify is for a credit payout",
  "git grep over app/ for payout.create, createMany and upsert, nested payout writes and INSERT INTO: no other path (12 Nov 2026)",
