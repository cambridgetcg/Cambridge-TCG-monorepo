status = "verified"
channels = ["landing"]
sources = [
  "prisma/schema.prisma:261-266: a tier is a name, a minimum spend and a cashback rate",
  "app/lib/tiers.server.ts:124-132: qualify places a customer in the tier with the highest minimum their spend has reached",
