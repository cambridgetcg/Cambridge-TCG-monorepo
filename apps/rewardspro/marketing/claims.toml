  "app/shopify/bulk-import.server.ts:36-39, 89: the import reads 365 days before install with read_all_orders, otherwise 60",
  "shopify.app.toml:49: read_all_orders is among the scopes asked for",
]
uncertainties = []
review_after = "2027-02-10"

[[claim]]
id = "rp-cashback-base"
claim = "Cashback is paid on the product price after discounts, as the order stood when it was paid, less any part of the order paid with store credit or gift cards. Shipping, and gift cards bought as products, earn nothing."
scope = "Orders no edit changed before RewardsPro first records them (PR #187 at 740f2da0)."
status = "verified"
channels = ["listing", "landing"]
sources = [
  "app/lib/order-facts.ts:80-97: the base is the product value less store-credit and gift-card payments, never below zero",
  "app/shopify/order-source.server.ts:244-250: a line's value is its total less its discounts; a gift card bought as a product counts as zero",
  "app/lib/record-order.server.ts:177-182, 197: the base is written once, when the order is first recorded",
]
uncertainties = [
  "A store-credit or gift-card payment comes off the product value even when it paid for shipping.",
  "An item added by an edit after the order is first recorded earns nothing (#190).",
  "Store-credit and gift-card payments are recognised by the gateway's name (app/shopify/order-source.server.ts:206-210): one named another way is not taken off.",
  "No order paid with a gift card has been run.",
]
review_after = "2027-02-10"

# Re-checked against main 221d8574 on 10 Nov 2026, after #206 merged; this row's lines are at 221d8574.
[[claim]]
id = "rp-refund-takeback"
claim = "When items are refunded, RewardsPro takes back their share of the cashback, up to the store credit the customer still holds in the order's currency. A refund of shipping alone takes nothing back."
scope = "Stores whose prices include tax; orders with no item added after payment by an edit or an exchange; and refunds within the app's read limits: fewer than 20 refunds on the order, and no refund of it with more than 100 lines or with 20 or more transactions or shipping lines (PR #187 at 740f2da0)."
status = "verified"
channels = ["listing", "landing"]
sources = [
  "app/lib/order-facts.ts:109-130: a refund takes its share, rounded down; the refund that completes the order takes what is left; shipping alone takes nothing",
  "app/lib/payouts.server.ts:246-258: the take-back is capped at the customer's balance in the payout's currency",
  "app/shopify/order-source.server.ts:54, 330-331, 351-352, 686-687: the read limits",
  "app/routes/webhooks.orders.refunded.tsx:65-74: refunds/create reads and values the refund, then records it",
  "docs/gates.md:23-24: production refunds E and F",
]
uncertainties = [
  "'Still holds' means Shopify's balance in that currency from any source, not only RewardsPro's credit.",
  "Exchanges are left out because none has been run, not because the sentence is known to fail for them.",
  "A money-only refund whose money is still pending is recorded at what has succeeded; the hourly check reads it again and, once its money has succeeded or failed, or after 30 days at what has succeeded, takes back its share once, sent by a later run (#206: app/lib/refunds.server.ts:35-44, 407-477; app/lib/payout-check.server.ts:14-24, 84; vercel.json:8). Not yet seen on a store: it assumes the settled money shows in that refund's own transactions; if not, the refund settles at 30 days at what had succeeded, with one cron problem (PR #206, 'Not proven').",
  "Nothing is taken back from a customer whose data was erased (customers/redact): app/lib/refunds.server.ts:268-274.",
]
review_after = "2027-02-10"

