  "extensions/rewards-widget/assets/rewards-widget.js:111-129: progress only when a next tier can be reached",
  "extensions/rewards-widget/assets/rewards-widget.js:163-177: guests: nothing while off; the rate when on and above 0%; the merchant's words or the sign-in link",
