[[claim]]
id = "rp-zero-base-rate"
claim = "With a base rate of 0%, orders from customers in your lowest tier earn no cashback. A customer's orders earn cashback once they are in a tier you have set above 0%, by their spend or because you lock them to it, at that tier's rate."
scope = "A setting, said as a setting, never as advice or a result: not 'so only returning customers earn', not 'reward loyalty', nothing about customers staying, returning or spending more. Some orders still earn nothing (/help/#earn-nothing). Its limits go with it: (1) the order that takes a customer from the lowest tier into a higher one earns nothing, however large, and a new customer starts in the lowest tier; (2) past orders brought in at install count towards tiers, so a customer can be in a tier above 0% before they order again; (3) when a customer's counted spend falls below their tier's minimum (a refund, a cancellation, or, under Last 12 months, older orders leaving the window), they move down at the next update, with no grace period, unless locked; (4) if a refund or a cancellation later moves a customer back down, the cashback their other orders earned in the higher tier is not taken back: a refund takes back the refunded order's own share and no more, and the order that took them up from the lowest tier earned nothing to take back, so a shop can fund cashback at a tier's rate for a customer whose kept spend never reached that tier; (5) cashback can be switched on before a tier above 0% exists, and until one does, no order earns any; (6) while cashback is on, the widget shows guests no rate and shows signed-in customers in the lowest tier '0% back as store credit'; when there is a higher tier they can reach, it names that tier and the amount left, but not its rate, and with a single tier it says 'You are on the top tier'; if the widget's settings can't be written to Shopify when 0% is saved, guests see the old rate until the nightly rewrite; (7) the help page's test order earns nothing at 0%, and locking yourself to a tier above 0% after it is recorded makes the next order earn that rate. Said on the help page first (the owner, 12 Nov 2026); a post may follow only with these limits beside it."
status = "proposed"
channels = ["landing"]
