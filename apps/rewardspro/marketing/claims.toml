# RewardsPro claims ledger: the public sentences about RewardsPro, each with its source.
#
# Last update: 10 Nov 2026, by RewardsPro's Growth lead (RP-06, #166, PR #207). From now on, the source of a new
# public sentence goes in the body of the PR that adds it, and this file isn't extended. Every earlier row, with its
# history, is in git: this file on main before PR #207, and PR #207's earlier commits (up to e8c90600).
#
# Kept: the rows behind a sentence on the live App Store listing or rewardspro.io, or in the listing text of PR #208
# (App Store ads are built from the listing), plus the four rows PR #187 re-checked. The other 24 rows backed only
# drafts, social posts or internal notes, and were cut.
#
# status
#   verified  checked on 10 Nov 2026, twice: by the writer and by the one read. Product rows: against the code under
#             apps/rewards at origin/main dbd67564, which is unchanged at 8a930f1a. rp-maker, and the Shopify
#             halves of rp-free, rp-merchant-funds and the sh-* rows: against the saved copies named (not fetched
#             again). Production serves apps/rewards from main (docs/gates.md:7, the record of 7 Nov 2026; not
#             probed today), and the live Shopify release, rewardspromembership-217 (74a0be5a,
#             docs/switch.md:85), has the same extensions/ and shopify.app.toml as main (git diff 74a0be5a
#             8a930f1a on those paths is empty).
#   proposed  not shown true yet; the row says what is missing.
#
# A sentence is used only with its scope. Locators are under apps/rewards/, with lines at dbd67564. The sh-* rows are
# Shopify's rules, not RewardsPro's: re-read Shopify's page before review_after.
# channels: listing (the App Store listing, and the ads built from it), landing (rewardspro.io, /help/ included),
# internal (never public).

[[claim]]
id = "rp-store-credit"
claim = "RewardsPro pays cashback as Shopify store credit."
scope = "A store with cashback switched on and at least one tier."
status = "verified"
channels = ["listing", "landing"]
sources = [
  "app/lib/record-order.server.ts:225-235: an order that earns cashback gets a pending payout on rail shopify_store_credit",
  "prisma/schema.prisma:89-90: shopify_store_credit is the only payout rail",
  "app/shopify/store-credit-rail.server.ts:306-307: the credit is storeCreditAccountCredit on the store's own customer",
  "app/shopify/graphql.ts:62, 91, 655, 716: the app's only mutations are a credit, a debit, a bulk order read and the widget's metafields",
  "docs/switch.md:77 and docs/gates.md:20: production test orders #1010 and #1011 were credited as store credit",
]
uncertainties = []
review_after = "2027-02-10"

[[claim]]
id = "rp-paid-trigger"
claim = "For an order that earns cashback, payment is what triggers it; RewardsPro doesn't wait for the order to be fulfilled."
scope = "A store that takes payment at checkout. Where a store takes payment later, at fulfilment for example, cashback follows that payment. No timing words ('instant', 'within seconds'): a credit that fails to send is retried for up to 24 hours (app/lib/payouts.server.ts:40-41)."
status = "verified"
channels = ["listing", "landing"]
sources = [
  "shopify.app.toml:21-44: orders/paid is the only order topic that records an order; no fulfilment topic is subscribed",
  "app/routes/webhooks.orders.paid.tsx:55-64: records the order, then sends the payout",
  "app/lib/record-order.server.ts:234-235: the payout is created pending and due at once",
  "app/lib/payout-check.server.ts:327 and app/shopify/order-source.server.ts:743: the hourly sweep records missed orders, listing only paid, partly refunded or refunded ones",
  "git grep -i fulfil over app/, extensions/, prisma/ and shopify.app.toml: one comment only (app/lib/payout-check.server.ts:290)",
]
uncertainties = [
  "That orders/paid fires when payment is captured, on a store that captures later, is Shopify's behaviour and wasn't checked.",
]
review_after = "2027-02-10"

