claim = "RewardsPro asks for a review only after your store's third cashback entry, and no sooner than seven days after you first opened the app. It stops once you dismiss it, Shopify has shown its request, or Shopify says you have already reviewed the app. Nothing is offered for a review."
scope = "The app's Home page. A store whose data was erased after an uninstall (shop/redact) starts again if it reinstalls."
status = "verified"
channels = ["landing"]
sources = [
  "app/lib/stats.server.ts:225-227, 240-245: due once there are three cashback entries and seven days have passed since the store's first open, unless dismissed or shown",
  "app/lib/merchant.server.ts:84-85: the store's row, with its date, is made at the first open",
  "app/routes/app._index.tsx:189-196, 269-273 and app/admin/home-rules.ts:43-45: Dismiss, or Shopify's answer 'success' or 'already-reviewed', stops it",
  "app/routes/app._index.tsx:514-528: the card says only 'A review helps other merchants find RewardsPro.', 'Leave a review' and 'Dismiss'",
]
uncertainties = [
  "While it is due, Shopify's request is tried on each Home visit: any other answer records nothing.",
  "No test guards 'Nothing is offered'.",
]
review_after = "2027-02-10"

