#
# Last update: 10 Nov 2026, by RewardsPro's Growth lead (RP-06, #166, PR #207). From now on, the source of a new
# public sentence goes in the body of the PR that adds it, and this file isn't extended. Every earlier row, with its
# history, is in git: this file on main before PR #207, and PR #207's earlier commits (up to e8c90600).
# 12 Nov 2026 (PR #242): social-post added to 13 rows and to the channel list; rp-tier-lock's scope widened to tier
# deletion and to the customer's erasure, checked against the code at 8daf7f09 by the writer and a fresh reader.
#
# Kept: the rows behind a sentence on the live App Store listing or rewardspro.io, or in the listing text of PR #208
# (App Store ads are built from the listing), plus the four rows PR #187 re-checked. The other 24 rows backed only
# drafts, social posts or internal notes, and were cut.
#
# status
#   verified  checked on 10 Nov 2026, twice: by the writer and by the one read. Product rows: against the code under
#             apps/rewards at origin/main dbd67564, which is unchanged at 8a930f1a. rp-maker, and the Shopify
#             halves of rp-free, rp-merchant-funds and the sh-* rows: against the saved copies named (not fetched
#             again). Production serves apps/rewards from main (docs/gates.md:7, the record of 7 Nov 2026; not
#             probed today), and the live Shopify release, rewardspromembership-217 (74a0be5a,
#             docs/switch.md:85), has the same extensions/ and shopify.app.toml as main (git diff 74a0be5a
#             8a930f1a on those paths is empty).
#   proposed  not shown true yet; the row says what is missing.
