name: Deploy & domain health

# Hourly check that the three production domains are alive AND that each
# Vercel project's latest production deploy is in READY state. Opens (or
# updates) a GitHub issue tagged `deploy-health` when something regresses;
# closes the issue automatically when the next clean run passes.
#
# Required secret: VERCEL_TOKEN — a Vercel API token with read access to
# the cambridgetcgs-projects team. Create at vercel.com/account/tokens.

on:
  schedule:
    - cron: "5 * * * *"   # hourly at :05
  workflow_dispatch:       # manual trigger from Actions UI
  # A push on any branch that changes the health check runs the offline unit
  # tests, so a regression shows before it reaches main. The live check job
  # below runs on main only.
  push:
    paths:
      - ".github/workflows/health.yml"
      - ".github/scripts/deploy-health.py"
      - ".github/scripts/test_deploy_health.py"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Unit-test the health script (offline)
        # Stdlib-only tests of deploy-health.py's state classification: no
        # network, no secrets. A failure means the script itself regressed.
        # Separate job: a failure here goes red without stopping the live
        # check and issue update in `check`.
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  check:
    # main only (cron and dispatch run on the default branch). A branch run
    # would measure drift against an undeployed branch head and post that to
    # the deploy-health issue.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full commit history (no file contents) so `git log -- apps/<x>`
          # finds the commit that last touched each app. In a depth-1 clone
          # the single commit appears to touch every path, which reports
          # false drift whenever the head commit is newer than the deploys.
          fetch-depth: 0
          filter: blob:none

      - name: Health check
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_HR4tb4WB0KZsKxqroSCTQrof
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Don't fail the step on the script's non-zero exit; we need to
        # capture its report to GITHUB_OUTPUT so the next step can use it.
        # Re-export the script's exit code as `outcome` for the next step
        # to decide whether to open or close an issue.
        run: |
          set -u
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set on this repo. Add at Settings → Secrets → Actions."
            exit 1
          fi
          # GitHub Actions runs every step with `bash -e`. The script exits 1
          # on regression — disable errexit for that command so we can capture
          # the exit code without short-circuiting the rest of the step.
          status=0
          python3 .github/scripts/deploy-health.py > health-report.txt || status=$?
          cat health-report.txt
          {
            echo "report<<EOF"
            cat health-report.txt
            echo "EOF"
            echo "outcome=$status"
          } >> "$GITHUB_OUTPUT"

      - name: Open / update / close issue
        if: always() && steps.check.outputs.outcome != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
          # outcome is the script exit code (0 healthy, 1 regression)
          OUTCOME: ${{ steps.check.outputs.outcome }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          # Ensure the label exists (idempotent — `gh label create` errors if
          # it's already there, which we ignore).
          gh label create deploy-health \
            --description "Open issue tracked by .github/workflows/health.yml" \
            --color B60205 \
            -R "$REPO" 2>/dev/null || true

          NUM=$(gh issue list --label deploy-health --state open --json number --jq '.[0].number' -R "$REPO")

          if [ "$OUTCOME" = "0" ]; then
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "✅ Health restored at $(date -u +%FT%TZ)" -R "$REPO"
              echo "Closed issue #$NUM"
            else
              echo "All green — nothing to update."
            fi
          else
            BODY=$(cat <<EOF
          🔴 Deploy/domain health regression detected at $(date -u +%FT%TZ).

          \`\`\`
          ${REPORT:-(no report — see job logs)}
          \`\`\`

          Run: $RUN_URL
          EOF
          )
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "$BODY" -R "$REPO"
              echo "Updated existing issue #$NUM"
            else
              gh issue create \
                --title "Deploy health regression" \
                --label deploy-health \
                --body "$BODY" \
                -R "$REPO"
              echo "Opened new issue"
            fi
          fi
